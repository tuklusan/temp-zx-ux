name: Verify complete ZX-UX checkout
# Manual integrity check, so no duplicate runners are queued for code pushes.
on:
  workflow_dispatch:
concurrency:
  group: zx-ux-project-main
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all tracked files and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit, index, files and approved specification
        shell: bash
        run: |
          set -euo pipefail
          git fsck --full --no-reflogs
          git diff --exit-code
          git diff --cached --exit-code
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tracked = subprocess.check_output(['git', 'ls-files', '-s', '-z']).split(b'\0')
          count = 0
          total = 0
          tracked_paths = set()
          for record in tracked:
              if not record:
                  continue
              descriptor, path = record.split(b'\t', 1)
              mode, expected_blob, stage = descriptor.split(b' ')
              assert stage == b'0', 'Unmerged index entry'
              filename = os.fsdecode(path)
              assert not filename.startswith('/') and '..' not in Path(filename).parts
              file = root / filename
              assert file.is_file() or file.is_symlink(), 'Missing file'
              actual = subprocess.check_output(['git', 'hash-object', '--', filename]).strip()
              assert actual == expected_blob, 'Git index byte mismatch'
              count += 1
              total += file.lstat().st_size
              tracked_paths.add(filename)
          required = {
              'docs/04-C48 Language Specification Rev 0.11.docx',
              'programs/c48/demos/hanoi.c',
              'programs/c48/demos/queens8.c',
              'programs/c48/ailmzx48/ailmzx48.c',
              'sdk/rcc/driver.py',
              'sdk/tests/runs.json',
              'sdk/tests/v1-screens.json',
              'tools/release_v1.py',
              'tests/fuse_boot.py',
          }
          assert required <= tracked_paths, 'Missing required v1 checkout files'
          spec = root / 'docs/04-C48 Language Specification Rev 0.11.docx'
          data = spec.read_bytes()
          assert len(data) == 1430306, 'Unexpected C48 specification size'
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '577a93270fcd14efc13b4b2b2e6c7c08eaafd24efbd771199ed4a0278ec037ec'
          assert not (root / 'c48-sdk').exists()
          print('CHECKOUT_COMPLETE')
          print('SOURCE_SHA', commit)
          print('TREE_SHA', subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip())
          print('TRACKED_FILES', count)
          print('TRACKED_BYTES', total)
          print('C48_SPEC_SHA256', digest)
          PY