name: ZX-UX 6000 Loader Fuse Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zxux-loader-6000-fuse.yml
      - experiments/zx-ux-loader-6000-fuse/**
      - '!experiments/zx-ux-loader-6000-fuse/output/**'

permissions:
  contents: write

env:
  DISPLAY: ":99"

jobs:
  fuse-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact source TAP
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/zx-ux-loader-6000-fuse
          test "$(sha256sum ZX-UX.tap | awk '{print $1}')" = "4f18817a198c7e6ad3a44b12503c112c204968bae207214bc74c4384dedb6fb9"

      - name: Install Fuse
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             fuse-emulator-gtk=1.6.0+dfsg1-2build3             libspectrum8=1.5.0-4build2             xvfb=2:21.1.12-1ubuntu1.8             x11-apps xdotool imagemagick
          fuse --version

      - name: Build corrected TZX
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/zx-ux-loader-6000-fuse/build.py
          test -s experiments/zx-ux-loader-6000-fuse/output/zx-ux-new-loader-test.tzx
          unzip -t experiments/zx-ux-loader-6000-fuse/output/zx-ux-new-loader-test.tzx.zip

      - name: Real-speed Fuse proof
        shell: bash
        run: |
          set -euo pipefail
          d=experiments/zx-ux-loader-6000-fuse/output

          Xvfb :99 -screen 0 1280x900x24 >"$d/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 1

          cat >"$d/debugger.txt" <<'DBG'
          breakpoint 0x5ce7
          breakpoint 0x0daf if z80:sp > 0xff00
          breakpoint 0x6000
          breakpoint time 0 if spectrum:frames > 8000
          breakpoint 0x0556
          commands 1
          print 11111111
          print z80:pc
          print z80:sp
          continue
          end
          commands 2
          print 22222222
          print z80:pc
          print z80:sp
          continue
          end
          commands 3
          print 60006000
          print z80:pc
          print z80:sp
          print [0x6000]
          print [0x6001]
          print [0x6002]
          print [0x6003]
          print [0x6004]
          print [0x6005]
          print [0x6006]
          print [0x6007]
          print [0x6008]
          print [0x6009]
          print [0x600a]
          print [0x600b]
          print [0x600c]
          print [0x600d]
          print [0x600e]
          print [0x600f]
          end
          commands 5
          print 55555555
          print z80:pc
          continue
          end
          commands 4
          print 90909090
          print z80:pc
          print z80:sp
          print [0x6000]
          print [0x6001]
          print [0x6002]
          print [0x6003]
          print [0x6004]
          print [0x6005]
          print [0x6006]
          print [0x6007]
          print [0x6008]
          print [0x6009]
          print [0x600a]
          print [0x600b]
          print [0x600c]
          print [0x600d]
          print [0x600e]
          print [0x600f]
          end
          continue
          DBG

          cmd="$(cat "$d/debugger.txt")"
          stdbuf -o0 -e0 fuse --machine 48 \
            --tape "$d/zx-ux-new-loader-test.tzx" \
            --auto-load --no-fastload --no-accelerate-loader --no-traps --no-detect-loader --no-sound \
            --no-confirm-actions --debugger-command "$cmd" \
            >"$d/fuse.log" 2>&1 &
          fuse_pid=$!

          echo "Fuse PID=$fuse_pid Xvfb PID=$xvfb_pid" > "$d/diagnostics.txt"
          # ROM tape traps and heuristic loader detection are disabled.
          # Start real-time playback only after LD_BYTES (0x0556) begins.
          (
            for j in $(seq 1 160); do
              if grep -A1 '^0x34fb5e3$' "$d/fuse.log" | grep -qx '0x556'; then
                win="$(xdotool search --name 'Fuse' 2>/dev/null | head -n1 || true)"
                if [ -n "$win" ]; then
                  xdotool windowfocus "$win" || true
                  xdotool key F8 || true
                  echo "manual_tape_play=sent window=$win" >>"$d/diagnostics.txt"
                else
                  echo "manual_tape_play=no_window" >>"$d/diagnostics.txt"
                fi
                exit 0
              fi
              sleep 0.1
            done
            echo "manual_tape_play=no_ldbytes_marker" >>"$d/diagnostics.txt"
          ) &
          tape_starter_pid=$!
          ps -ef | grep -E 'fuse|Xvfb' >> "$d/diagnostics.txt" || true
          # Stop on the actual destination PC, not merely a printed number.
          # Force a flush on exit before examining the debugger output.
          result="TIMEOUT"
          for i in $(seq 1 205); do
            if grep -A1 '^0x3939e70$' "$d/fuse.log" | grep -qx '0x6000'; then
              result="ENTRY_6000"
              break
            fi
            if grep -q '^0x56b29a2$' "$d/fuse.log"; then
              result="TIMEOUT"
              break
            fi
            if ! kill -0 "$fuse_pid" 2>/dev/null; then
              result="FUSE_EXITED"
              break
            fi
            sleep 1
          done

          xwd -root -silent -out "$d/fuse-final.xwd" || true
          convert "$d/fuse-final.xwd" "$d/fuse-final.png" || true

          kill "$tape_starter_pid" 2>/dev/null || true
          kill "$fuse_pid" 2>/dev/null || true
          wait "$fuse_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true

          if grep -A1 '^0x3939e70$' "$d/fuse.log" | grep -qx '0x6000'; then
            result="ENTRY_6000"
          fi

          echo "$result" | tee "$d/fuse-result.txt"
          echo "Result=$result" >> "$d/diagnostics.txt"
          grep -E '0x3939e70|0xa98ac7|0x153158e|0x34fb5e3|0x56b29a2|error|Error|Unknown' "$d/fuse.log" >> "$d/diagnostics.txt" || true
          cat "$d/fuse.log" || true

      - name: Record hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=experiments/zx-ux-loader-6000-fuse/output
          sha256sum             "$d/zx-ux-new-loader-test.tzx"             "$d/zx-ux-new-loader-test.tzx.zip"             "$d/fuse.log"             "$d/fuse-final.png" > "$d/SHA256SUMS"

      - name: Persist diagnostic output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/zx-ux-loader-6000-fuse/output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ZX-UX: persist 6000 loader Fuse diagnostics"
          git pull --rebase origin main
          git push origin main

      - name: Assert entry reached
        shell: bash
        run: |
          set -euo pipefail
          d=experiments/zx-ux-loader-6000-fuse/output
          cat "$d/fuse-result.txt"
          test "$(cat "$d/fuse-result.txt")" = "ENTRY_6000"
          grep -A1 '^0x3939e70$' "$d/fuse.log" | grep -qx '0x6000'
