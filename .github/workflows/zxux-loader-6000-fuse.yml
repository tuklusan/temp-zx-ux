name: ZX-UX 6000 Loader Fuse Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zxux-loader-6000-fuse.yml
      - experiments/zx-ux-loader-6000-fuse/**
      - '!experiments/zx-ux-loader-6000-fuse/output/**'

# GitHub Actions permits at most one running and one pending run per group.
# A newer push replaces any older pending run; the current Fuse proof completes.
# Keep this group shared by all runs of this project on main.
concurrency:
  group: zx-ux-project-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  DISPLAY: ":99"

jobs:
  fuse-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact source TAP
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/zx-ux-loader-6000-fuse
          test "$(sha256sum ZX-UX.tap | awk '{print $1}')" = "4f18817a198c7e6ad3a44b12503c112c204968bae207214bc74c4384dedb6fb9"

      - name: Install Fuse
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            fuse-emulator-gtk=1.6.0+dfsg1-2build3 \
            libspectrum8=1.5.0-4build2 \
            xvfb=2:21.1.12-1ubuntu1.8 \
            openbox x11-utils x11-apps xdotool imagemagick
          for bin in fuse Xvfb openbox xdotool xwininfo xprop convert; do
            command -v "$bin" || { echo "MISSING_REQUIRED_TOOL=$bin"; exit 1; }
          done
          # Ubuntu chooses OpenSE BASIC unless the authentic ROM is supplied.
          # Pin the exact official Noble 'spectrum-roms_20081224-5_all.deb'
          # (SHA-256 from packages.ubuntu.com/noble/all/spectrum-roms/download).
          rom_deb=/tmp/spectrum-roms_20081224-5_all.deb
          curl --fail --location --retry 3 --max-time 90 \
            https://archive.ubuntu.com/ubuntu/pool/multiverse/s/spectrum-roms/spectrum-roms_20081224-5_all.deb \
            --output "$rom_deb"
          echo "ef0aeda79444889debcff70b0260854203378ebe7b567d6d1b6d2577abe6d591  $rom_deb" | sha256sum --check
          mkdir -p /tmp/zx-spectrum-roms
          dpkg-deb --extract "$rom_deb" /tmp/zx-spectrum-roms
          rom=/tmp/zx-spectrum-roms/usr/share/spectrum-roms/48.rom
          test "$(stat --printf=%s "$rom")" -eq 16384
          echo "Official Sinclair 48K ROM:"
          sha256sum "$rom"
          fuse --version

      - name: Build corrected TZX
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/zx-ux-loader-6000-fuse/build.py
          test -s experiments/zx-ux-loader-6000-fuse/output/zx-ux-new-loader-test.tzx
          unzip -t experiments/zx-ux-loader-6000-fuse/output/zx-ux-new-loader-test.tzx.zip

      - name: Real-speed Fuse proof
        shell: bash
        run: |
          set -euo pipefail
          d=experiments/zx-ux-loader-6000-fuse/output

          Xvfb :99 -screen 0 1280x900x24 >"$d/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 1
          openbox >"$d/window-manager.log" 2>&1 &
          wm_pid=$!
          for i in $(seq 1 50); do
            if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id'; then break; fi
            sleep 0.1
          done
          xprop -root _NET_SUPPORTING_WM_CHECK >"$d/wm-state.txt" 2>&1 || true

          cat >"$d/debugger.txt" <<'DBG'
          breakpoint 0x5ce7
          breakpoint 0x0556
          breakpoint 0x6000
          breakpoint time 0 if spectrum:frames > 2600
          commands 1
          print 11111111
          print z80:pc
          print z80:sp
          continue
          end
          commands 2
          print 55555555
          print z80:pc
          print z80:sp
          continue
          end
          commands 3
          print 60006000
          print z80:pc
          print z80:sp
          print [0x6000]
          print [0x6001]
          print [0x6002]
          print [0x6003]
          print [0x6004]
          print [0x6005]
          print [0x6006]
          print [0x6007]
          print [0x6008]
          print [0x6009]
          print [0x600a]
          print [0x600b]
          print [0x600c]
          print [0x600d]
          print [0x600e]
          print [0x600f]
          end
          commands 4
          print 90909090
          print z80:pc
          print z80:sp
          print spectrum:frames
          print [0x5ccb]
          print [0x5ccc]
          print [0x5ccd]
          print [0x5cce]
          print [0x5ccf]
          print [0x6000]
          print [0x6001]
          print [0x6002]
          print [0x6003]
          print [0x6004]
          print [0x6005]
          print [0x6006]
          print [0x6007]
          print [0x6008]
          print [0x6009]
          print [0x600a]
          print [0x600b]
          print [0x600c]
          print [0x600d]
          print [0x600e]
          print [0x600f]
          end
          continue
          DBG

          cmd="$(cat "$d/debugger.txt")"
          stdbuf -o0 -e0 fuse --machine 48 --rom-48 /tmp/zx-spectrum-roms/usr/share/spectrum-roms/48.rom \
            --tape "$d/zx-ux-new-loader-test.tzx" \
            --no-auto-load --no-fastload --no-accelerate-loader --no-sound \
            --no-confirm-actions --debugger-command "$cmd" \
            >"$d/fuse.log" 2>&1 &
          fuse_pid=$!
          echo "Fuse PID=$fuse_pid Xvfb PID=$xvfb_pid WM PID=$wm_pid" > "$d/diagnostics.txt"
          (
            # The previous X11 path accidentally targeted an unmapped window.
            # Record all windows, select mapped/viewable Fuse window only.
            for i in $(seq 1 120); do
              xwininfo -root -tree >"$d/x11-windows.txt" 2>&1 || true
              wins="$(xdotool search --onlyvisible --class fuse 2>/dev/null || true)"
              [ -n "$wins" ] && break
              sleep 0.2
            done
            echo "visible_fuse_windows=$wins" >> "$d/diagnostics.txt"
            xprop -root _NET_ACTIVE_WINDOW >>"$d/diagnostics.txt" 2>&1 || true
            win="$(printf '%s\\n' "$wins" | head -n1)"
            if [ -z "$win" ]; then
              echo "inject=NO_VIEWABLE_FUSE_WINDOW" >>"$d/diagnostics.txt"
              exit 0
            fi
            xwininfo -id "$win" >"$d/fuse-window-info.txt" 2>&1 || true
            echo "target_window_name=$(xdotool getwindowname "$win" 2>/dev/null || true)" >> "$d/diagnostics.txt"
            xdotool windowactivate "$win" >>"$d/diagnostics.txt" 2>&1 || true
            xdotool mousemove --window "$win" 50 75 click 1 >>"$d/diagnostics.txt" 2>&1 || true
            xdotool windowfocus "$win" >>"$d/diagnostics.txt" 2>&1 || true
            echo "focus_after_activation=$(xdotool getwindowfocus 2>/dev/null || true)" >>"$d/diagnostics.txt"
            sleep 0.7
            xdotool key --clearmodifiers --delay 160 j quotedbl quotedbl Return >>"$d/diagnostics.txt" 2>&1 || true
            sleep 0.4
            xdotool key F8 >>"$d/diagnostics.txt" 2>&1 || true
            echo "inject=LOAD_quotes_play" >>"$d/diagnostics.txt"
            timeout 4s xwd -root -silent -out "$d/after-input.xwd" || true
            if [ -s "$d/after-input.xwd" ]; then
              timeout 4s convert "$d/after-input.xwd" "$d/after-input.png" || true
            fi
          ) &
          tape_starter_pid=$!
          ps -ef | grep -E 'fuse|Xvfb' >> "$d/diagnostics.txt" || true
          # Stop on the actual destination PC, not merely a printed number.
          # Force a flush on exit before examining the debugger output.
          result="TIMEOUT"
          echo "monitor_started=$(date -u +%FT%TZ)" >> "$d/diagnostics.txt"
          for i in $(seq 1 68); do
            if grep -A1 '^0x3939e70$' "$d/fuse.log" | grep -qx '0x6000'; then
              result="ENTRY_6000"
              break
            fi
            if grep -q '^0x56b29a2$' "$d/fuse.log"; then
              result="TIMEOUT_BREAKPOINT"
              break
            fi
            if ! kill -0 "$fuse_pid" 2>/dev/null; then
              result="FUSE_EXITED"
              break
            fi
            if [ "$i" -ge 60 ] && ! grep -q '^0xa98ac7$' "$d/fuse.log"; then
              result="LOADER_NEVER_ENTERED"
              break
            fi
            if ((i % 10 == 0)); then
              echo "poll=$i utc=$(date -u +%FT%TZ) bytes=$(wc -c < "$d/fuse.log")" | tee -a "$d/diagnostics.txt"
              grep -E '^0x(34fb5e3|a98ac7|153158e|3939e70|56b29a2)$' "$d/fuse.log" | tail -10 || true
            fi
            sleep 1
          done

          # Persist result before optional screenshots or process cleanup.
          echo "$result" | tee "$d/fuse-result.txt"
          echo "monitor_ended=$(date -u +%FT%TZ) result=$result" >> "$d/diagnostics.txt"
          timeout -k 2s 5s xwd -root -silent -out "$d/fuse-final.xwd" || echo "screenshot_xwd_failed" >> "$d/diagnostics.txt"
          if [ -s "$d/fuse-final.xwd" ]; then
            timeout -k 2s 5s convert "$d/fuse-final.xwd" "$d/fuse-final.png" || echo "screenshot_png_failed" >> "$d/diagnostics.txt"
          fi

          kill "$tape_starter_pid" 2>/dev/null || true
          kill -KILL "$fuse_pid" 2>/dev/null || true
          kill "$wm_pid" 2>/dev/null || true
          kill -KILL "$xvfb_pid" 2>/dev/null || true
          # Never wait indefinitely on a GUI emulator in a cloud runner.
          echo "cleanup_complete=$(date -u +%FT%TZ)" >> "$d/diagnostics.txt"
          if grep -A1 '^0x3939e70$' "$d/fuse.log" | grep -qx '0x6000'; then
            result="ENTRY_6000"
            echo "$result" > "$d/fuse-result.txt"
          fi

          echo "$result" | tee "$d/fuse-result.txt"
          echo "Result=$result" >> "$d/diagnostics.txt"
          grep -E '0x3939e70|0xa98ac7|0x34fb5e3|0x56b29a2|error|Error|Unknown' "$d/fuse.log" >> "$d/diagnostics.txt" || true
          cat "$d/fuse.log" || true

      - name: Record hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=experiments/zx-ux-loader-6000-fuse/output
          sha256sum "$d/zx-ux-new-loader-test.tzx" "$d/zx-ux-new-loader-test.tzx.zip" "$d/fuse.log" > "$d/SHA256SUMS"
          if test -s "$d/fuse-final.png"; then sha256sum "$d/fuse-final.png" >> "$d/SHA256SUMS"; fi

      - name: Persist diagnostic output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/zx-ux-loader-6000-fuse/output
          if git diff --cached --quiet; then
            exit 0
          fi
          # Rebase without merging generated binary diagnostic files.
          # Keep output from this runner, but base its commit on the latest main.
          git fetch origin main
          git reset --mixed origin/main
          git add experiments/zx-ux-loader-6000-fuse/output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ZX-UX: persist 6000 loader Fuse diagnostics"
          git push origin HEAD:main

      - name: Assert entry reached
        shell: bash
        run: |
          set -euo pipefail
          d=experiments/zx-ux-loader-6000-fuse/output
          cat "$d/fuse-result.txt"
          test "$(cat "$d/fuse-result.txt")" = "ENTRY_6000"
          grep -A1 '^0x3939e70$' "$d/fuse.log" | grep -qx '0x6000'
